name: Build Desktop (Dev)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Build platforms'
        required: true
        default: 'windows-and-macos'
        type: choice
        options:
          - windows-and-macos
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64

permissions:
  contents: read

# The installers go straight into a draft release named dev-build-<run id>,
# not into Actions artifacts: artifact storage has a quota (it filled up on
# 2026-11-05 and blocked every build for hours), release assets do not count
# against it. A draft creates no git tag and is visible only to people with
# write access. The draft is created first, each build job adds its own
# installers, and the last job writes one SHA256SUMS.txt for all of them.
# A draft without SHA256SUMS.txt is from a run that did not finish.
concurrency:
  group: build-desktop-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      release_tag: ${{ steps.draft.outputs.tag }}
    steps:
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dev-build-${{ github.run_id }}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Dev build ${{ github.run_id }}" \
            --notes "Unsigned installers from Build Desktop (Dev) run ${{ github.run_id }}, commit $GITHUB_SHA."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - id: set-matrix
        run: |
          ALL='[{"platform":"macos-latest","target_triple":"aarch64-apple-darwin","builder_args":"--mac dmg zip --arm64","label":"macOS-ARM64","artifact_name":"macos-arm64","smoke_platform":"macos","arch":"arm64"},{"platform":"macos-latest","target_triple":"x86_64-apple-darwin","builder_args":"--mac dmg zip --x64","label":"macOS-x64","artifact_name":"macos-x64","smoke_platform":"macos","arch":"x64"},{"platform":"windows-latest","target_triple":"x86_64-pc-windows-msvc","builder_args":"--win nsis --x64","label":"Windows-x64","artifact_name":"windows-x64","smoke_platform":"windows","arch":"x64"},{"platform":"windows-latest","target_triple":"aarch64-pc-windows-msvc","builder_args":"--win nsis --arm64","label":"Windows-ARM64","artifact_name":"windows-arm64","smoke_platform":"windows","arch":"arm64"},{"platform":"ubuntu-22.04","target_triple":"x86_64-unknown-linux-gnu","builder_args":"--linux AppImage deb --x64","label":"Linux-x64","artifact_name":"linux-x64","smoke_platform":"linux","arch":"x64"},{"platform":"ubuntu-22.04-arm","target_triple":"aarch64-unknown-linux-gnu","builder_args":"--linux AppImage deb --arm64","label":"Linux-ARM64","artifact_name":"linux-arm64","smoke_platform":"linux","arch":"arm64"}]'
          SELECTED="${{ inputs.platforms }}"
          if [ "$SELECTED" = "all" ]; then
            MATRIX=$(echo "$ALL" | jq -c '{include: .}')
          elif [ "$SELECTED" = "windows-and-macos" ]; then
            MATRIX=$(echo "$ALL" | jq -c '{include: [.[] | select(.smoke_platform == "windows" or .smoke_platform == "macos")]}')
          else
            MATRIX=$(echo "$ALL" | jq -c --arg sel "$SELECTED" '{include: [.[] | select(
              ($sel == "macos-arm64" and .label == "macOS-ARM64") or
              ($sel == "macos-x64" and .label == "macOS-x64") or
              ($sel == "windows-x64" and .label == "Windows-x64") or
              ($sel == "windows-arm64" and .label == "Windows-ARM64") or
              ($sel == "linux-x64" and .label == "Linux-x64") or
              ($sel == "linux-arm64" and .label == "Linux-ARM64")
            )]}')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    permissions:
      contents: write
    # A stuck step otherwise holds a (billed) runner for the 6-hour default.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The STAR console address and app secret the packaged app signs in
      # with. desktop/star-product.json is kept out of git; it comes from the
      # repository secret STAR_PRODUCT_JSON (masked in logs, never printed).
      - name: Write STAR product settings
        shell: bash
        env:
          STAR_PRODUCT_JSON: ${{ secrets.STAR_PRODUCT_JSON }}
        run: |
          if [ -z "$STAR_PRODUCT_JSON" ]; then
            echo "::error::Repository secret STAR_PRODUCT_JSON is not set: the packaged app could not reach the STAR console."
            exit 1
          fi
          printf '%s' "$STAR_PRODUCT_JSON" > desktop/star-product.json
          node -e "const p = require('./desktop/star-product.json'); if (!p.saasBaseUrl || !p.saasAppSecret) { console.error('::error::STAR_PRODUCT_JSON needs saasBaseUrl and saasAppSecret'); process.exit(1) }"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libfuse2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: bun install

      - name: Install desktop dependencies
        working-directory: desktop
        # The x64 Windows runner also packages ARM64; retain both native addons.
        run: bun install --cpu="*"

      - name: Install adapter dependencies
        working-directory: adapters
        run: bun install

      - name: Verify Windows legacy data recovery
        if: matrix.smoke_platform == 'windows'
        working-directory: desktop
        run: bun run test:windows-storage-recovery

      - name: Prepare bundled ripgrep
        working-directory: desktop
        env:
          SIDECAR_TARGET_TRIPLE: ${{ matrix.target_triple }}
        run: bun run prepare:ripgrep

      # native/cu-helper/build.sh never signs the Computer Use helper ad hoc
      # (that would drop the user's Accessibility and Screen Recording grants
      # on every update) and an unsigned development build has no Apple
      # certificate. Its fallback for that case is a self-signed Code Signing
      # identity named "cu-helper-dev"; this creates one for the job in a
      # temporary keychain. Only the helper uses it: the sidecar stays ad hoc
      # and the app unsigned (desktop/scripts/sign-identity.ts only looks for
      # Apple certificates), so Computer Use is unavailable in these builds,
      # as in any unsigned build.
      - name: Create a temporary signing identity for the Computer Use helper
        if: matrix.smoke_platform == 'macos'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cu-helper-dev"
          mkdir -p "$work"
          keychain="$work/cu-helper-dev.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_password="$(openssl rand -hex 24)"
          cat > "$work/cert.cnf" <<'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = cu-helper-dev
          [ext]
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          EOF
          # The system LibreSSL writes a PKCS#12 file that `security import` reads.
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 7 -config "$work/cert.cnf" \
            -keyout "$work/key.pem" -out "$work/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$work/key.pem" -in "$work/cert.pem" \
            -name cu-helper-dev -out "$work/identity.p12" -passout "pass:$p12_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/identity.p12" -k "$keychain" -P "$p12_password" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$work/key.pem" "$work/identity.p12"
          # Trusted for code signing, the identity counts as valid, which is
          # what build.sh looks for.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$work/cert.pem"
          security find-identity -v -p codesigning | grep -F '"cu-helper-dev"'

      - name: Build sidecars
        working-directory: desktop
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          SIDECAR_TARGET_TRIPLE: ${{ matrix.target_triple }}
        run: bun run build:sidecars

      - name: Verify compiled Windows sidecar startup
        if: matrix.smoke_platform == 'windows' && matrix.arch == 'x64'
        working-directory: desktop
        env:
          CC_HAHA_COMPILED_SIDECAR_SMOKE_STARTS: '20'
        run: bun run test:compiled-sidecar-smoke

      - name: Build renderer and Electron bundles
        working-directory: desktop
        run: |
          bun run build
          bun run build:electron

      - name: Rebuild node-pty for the Linux glibc floor
        if: matrix.smoke_platform == 'linux'
        working-directory: desktop
        run: bash ./scripts/rebuild-node-pty-linux.sh

      # The Windows installer ships the STAR Code IDE next to the app
      # (build-resources/star-code, electron-builder extraResources). The IDE
      # build (~460 MB) is not in git: it is the STAR-Code-win32-<arch>.zip asset
      # of this repository's release named by the STAR_CODE_RELEASE_TAG variable
      # (the ARM64 one comes from Build STAR Code (IDE)). A release without an
      # ARM64 build gives the ARM64 installer the x64 IDE, which Windows on ARM
      # runs under emulation.
      - name: Stage bundled STAR Code
        if: matrix.smoke_platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STAR_CODE_RELEASE_TAG: ${{ vars.STAR_CODE_RELEASE_TAG }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if (-not $env:STAR_CODE_RELEASE_TAG) {
            Write-Output '::error::Repository variable STAR_CODE_RELEASE_TAG is not set (the release holding STAR-Code-win32-x64.zip).'
            exit 1
          }
          $assets = @(gh release view $env:STAR_CODE_RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = "STAR-Code-win32-$env:TARGET_ARCH.zip"
          if ($assets -notcontains $zip) {
            if ($env:TARGET_ARCH -eq 'x64') {
              Write-Output "::error::Release $env:STAR_CODE_RELEASE_TAG has no $zip."
              exit 1
            }
            Write-Output "::warning::Release $env:STAR_CODE_RELEASE_TAG has no $zip; this installer bundles the x64 IDE."
            $zip = 'STAR-Code-win32-x64.zip'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'star-code'
          gh release download $env:STAR_CODE_RELEASE_TAG --pattern $zip --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The archive holds the build's contents at its root ("STAR Code.exe"
          # and its siblings). The bsdtar in System32 unpacks the ~11k files far
          # faster than Expand-Archive; the tar on PATH may be Git's GNU tar,
          # which cannot read zip.
          $build = Join-Path $dir 'build'
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          & (Join-Path $env:SystemRoot 'System32\tar.exe') -xf (Join-Path $dir $zip) -C $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location desktop
          bun run stage:star-code --from $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # `bun install --cpu="*"` put the sharp and ngrok addons of every Windows
      # chip in node_modules, and electron-builder ships whatever is there.
      # Only this job's chip goes into the installer, as in
      # scripts/build-windows.ps1 for local builds.
      - name: Leave other chips' native addons out
        if: matrix.smoke_platform == 'windows'
        shell: pwsh
        working-directory: desktop
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          foreach ($chip in @('x64', 'arm64', 'ia32') | Where-Object { $_ -ne $env:TARGET_ARCH }) {
            foreach ($relative in @("@img/sharp-win32-$chip", "@ngrok/ngrok-win32-$chip-msvc")) {
              $installed = Join-Path 'node_modules' $relative
              if (Test-Path -LiteralPath $installed) {
                Remove-Item -LiteralPath $installed -Recurse -Force
                Write-Output "Left out of this installer: $relative"
              }
            }
          }

      # Development builds are unsigned, so there is nothing to notarize:
      # package.json keeps mac.notarize=true for the signed release path, and
      # this turns it off the way scripts/build-macos-arm64.sh does locally.
      - name: Build Electron app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # Quoted: unquoted, PowerShell splits the argument at the first dot.
        run: node ./node_modules/electron-builder/out/cli/cli.js ${{ matrix.builder_args }} --publish never '-c.mac.notarize=false'

      # The installer carries the STAR Code IDE (about 11,000 files), so one
      # silent install takes longer than the script's 180-second default, and
      # the smoke runs several installs and reinstalls.
      - name: Verify Windows installer execution
        if: matrix.smoke_platform == 'windows' && matrix.arch == 'x64'
        timeout-minutes: 45
        working-directory: desktop
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/windows-installer-smoke.ps1 -ArtifactsDir ./build-artifacts/electron -Arch x64 -InstallTimeoutSeconds 900

      # Evidence for a failed installer smoke: Windows Error Reporting names the
      # faulting module of a crashed installer, and an installer that never
      # finished leaves its NSIS plug-in folder (with the unpacked app) in TEMP.
      - name: Diagnose a failed Windows installer smoke
        if: failure() && matrix.smoke_platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001, 1002; StartTime = (Get-Date).AddHours(-2) } -ErrorAction SilentlyContinue |
            Select-Object -First 10 | ForEach-Object { '--- event {0} at {1}' -f $_.Id, $_.TimeCreated; $_.Message }
          Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'ns*.tmp' -ErrorAction SilentlyContinue | ForEach-Object {
            $files = @(Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue)
            $longest = ($files | ForEach-Object { $_.FullName.Length } | Measure-Object -Maximum).Maximum
            '{0}: {1} files, longest path {2} characters' -f $_.FullName, $files.Count, $longest
          }

      - name: Verify packaged app structure
        run: bun run test:package-smoke --platform ${{ matrix.smoke_platform }} --arch ${{ matrix.arch }} --package-kind release --artifacts-dir desktop/build-artifacts/electron ${{ matrix.smoke_platform == 'linux' && '--max-linux-glibc 2.28' || '' }}

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          STAGING="desktop/build-artifacts/ci-PRIVO-STAR-WORK-v${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}"
          mkdir -p "$STAGING"
          find desktop/build-artifacts/electron -maxdepth 1 -type f \
            \( -name "*.dmg" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.yml" \) \
            | while read -r artifact; do
              cp -f "$artifact" "$STAGING/"
            done
          if [ "${{ matrix.smoke_platform }}" = "macos" ]; then
            cp -f desktop/scripts/install-macos-unsigned.sh "$STAGING/"
          fi
          echo "staging_dir=$STAGING" >> "$GITHUB_OUTPUT"
          ls -lh "$STAGING/" 2>/dev/null || true

      # The installers (and the macOS install script) go into the run's draft
      # release, with this job's checksums. The updater .yml files stay out:
      # both chips of a platform write one of the same name, and the draft
      # release never held them.
      - name: Upload installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          STAGING: ${{ steps.collect.outputs.staging_dir }}
        run: |
          set -euo pipefail
          cd "$STAGING"
          files=()
          for file in *.dmg *.exe *.deb *.AppImage install-macos-unsigned.sh; do
            [ -f "$file" ] && files+=("$file")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer was built in $STAGING"
            exit 1
          fi
          sums="SHA256SUMS-${{ matrix.artifact_name }}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- "${files[@]}" > "$sums"
          else
            shasum -a 256 -- "${files[@]}" > "$sums"
          fi
          cat "$sums"
          gh release upload "$TAG" "${files[@]}" "$sums" --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write SHA256SUMS.txt for the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS-*.txt' --dir sums
          # Both macOS jobs list install-macos-unsigned.sh; keep one line per file.
          cat sums/*.txt | sed 's/ \*/  /' | sort -k2 -u > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          for part in sums/*.txt; do
            gh release delete-asset "$TAG" "$(basename "$part")" --repo "$GITHUB_REPOSITORY" --yes
          done
          echo "Draft release: $TAG"
