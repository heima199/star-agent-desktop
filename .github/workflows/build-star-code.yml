name: Build STAR Code (IDE)

# Packages the STAR Code IDE (a Code-OSS fork that is compiled on the
# maintainer's Windows x64 machine) for the chips that machine cannot build:
# macOS on Apple silicon and on Intel, and Windows on ARM64.
#
# The maintainer attaches two archives to a release of this repository:
#   star-code-src.tar.gz  the IDE sources (no node_modules, no build output)
#   star-code-out.tar.gz  the compiled JavaScript of the Windows x64 build
#                         (out-vscode, out-build/date), its built-in extensions
#                         (.build/extensions) and .star-build/commit
# The JavaScript is the same on every platform, so a job here only installs the
# native dependencies for its chip (npm ci with npm_config_arch) and runs the
# Code-OSS packaging task `gulp vscode-<platform>-<arch>-ci`. The packages are
# attached to the same release:
#   STAR-Code-<version>-mac-arm64.dmg and STAR-Code-darwin-arm64.zip
#   STAR-Code-<version>-mac-x64.dmg and STAR-Code-darwin-x64.zip
#   STAR-Code-UserSetup-arm64-<version>.exe and STAR-Code-win32-arm64.zip
# Build Desktop (Dev) bundles STAR-Code-win32-<arch>.zip into the Windows
# installer of the same chip. There is no Apple certificate: the macOS app is
# signed ad hoc, so macOS asks the user once to allow it.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release with star-code-src.tar.gz and star-code-out.tar.gz (for example star-code-b2)'
        required: true
        type: string
      targets:
        description: 'Packages to build'
        required: true
        default: 'mac-and-windows-arm64'
        type: choice
        options:
          - mac-and-windows-arm64
          - mac-arm64
          - mac-x64
          - win-arm64

permissions:
  contents: write

concurrency:
  group: build-star-code-${{ inputs.release_tag }}-${{ inputs.targets }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          # Pinned images: Code-OSS 1.99 native modules and its preinstall check
          # predate Xcode 26 and Visual Studio 2026, which the -latest labels use.
          ALL='[{"os":"macos-15","platform":"darwin","arch":"arm64","suffix":"mac-arm64"},{"os":"macos-15-intel","platform":"darwin","arch":"x64","suffix":"mac-x64"},{"os":"windows-2022","platform":"win32","arch":"arm64","suffix":"win-arm64"}]'
          if [ "$TARGETS" = "mac-and-windows-arm64" ]; then
            MATRIX=$(echo "$ALL" | jq -c '{include: .}')
          else
            MATRIX=$(echo "$ALL" | jq -c --arg sel "$TARGETS" '{include: [.[] | select(.suffix == $sel)]}')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: Package (${{ matrix.suffix }})
    # A stuck step otherwise holds a (billed) runner for the 6-hour default.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      # The packaging tasks write to ../$STAR_PACKAGE_FOLDER (gulpfile.vscode*.js)
      STAR_PACKAGE_FOLDER: STAR-Code-${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - name: Download the sources and the compiled output
        run: |
          set -euo pipefail
          # POSIX form of the temp folder: Git Bash globs and cds cannot use D:\a\_temp
          temp="$(cd "$RUNNER_TEMP" && pwd)"
          echo "STAR_TEMP=$temp" >> "$GITHUB_ENV"
          mkdir -p "$temp/in" "$temp/out" "$temp/smoke" code
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$temp/in" \
            --pattern 'star-code-src.tar.gz' --pattern 'star-code-out.tar.gz'
          tar_cmd=tar
          # bsdtar on Windows: the archives were made with it
          if [ "$RUNNER_OS" = "Windows" ]; then tar_cmd=/c/Windows/System32/tar.exe; fi
          "$tar_cmd" -xzf "$temp/in/star-code-src.tar.gz" -C code
          "$tar_cmd" -xzf "$temp/in/star-code-out.tar.gz" -C code
          test -f code/out-vscode/vs/workbench/workbench.desktop.main.js
          test -f code/out-build/date
          # Windows has no executable bit, so the archives carry none
          find code -name '*.sh' -exec chmod +x {} +
          # build/npm/postinstall.js ends with `git config` in the repository;
          # the commit for product.json comes from BUILD_SOURCEVERSION below
          git init -q code
          echo "BUILD_SOURCEVERSION=$(tr -d '\r\n' < code/.star-build/commit)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: code/.nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read version
        run: echo "STAR_VERSION=$(node -p "require('./code/product.json').voidVersion")" >> "$GITHUB_ENV"

      - name: Install dependencies for ${{ matrix.arch }}
        working-directory: code
        env:
          # node-gyp builds every native module for this chip (Code-OSS cross builds this way)
          npm_config_arch: ${{ matrix.arch }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then exit 0; fi
            echo "::warning::npm ci attempt $attempt failed; retrying in 60 seconds"
            sleep 60
          done
          exit 1

      - name: Package
        working-directory: code
        run: node --max-old-space-size=6144 ./node_modules/gulp/bin/gulp.js "vscode-${{ matrix.platform }}-${{ matrix.arch }}-ci"

      - name: Sign ad hoc, build the dmg and zip (macOS)
        if: matrix.platform == 'darwin'
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/$STAR_PACKAGE_FOLDER/STAR Code.app"
          test -d "$app"
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo -archs "$app/Contents/MacOS/$name"
          lipo -archs "$app/Contents/MacOS/$name" | grep -qw "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          xattr -cr "$app"
          # Packaging rewrites Info.plist and renames the bundle, which breaks the
          # signature Electron ships with, and macOS does not run unsigned code on
          # Apple silicon. Without an Apple certificate the app is signed ad hoc.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$STAR_TEMP/dmg"
          ditto "$app" "$STAR_TEMP/dmg/STAR Code.app"
          ln -s /Applications "$STAR_TEMP/dmg/Applications"
          dmg="$STAR_TEMP/out/STAR-Code-$STAR_VERSION-${{ matrix.suffix }}.dmg"
          for attempt in 1 2 3; do
            if hdiutil create -volname "STAR Code" -srcfolder "$STAR_TEMP/dmg" -ov -format UDZO "$dmg"; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
          hdiutil verify "$dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$STAR_TEMP/out/STAR-Code-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          ls -l "$STAR_TEMP/out"

      - name: Open the app once (macOS)
        if: matrix.platform == 'darwin'
        run: |
          set -uo pipefail
          app="$STAR_TEMP/dmg/STAR Code.app"
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          smoke="$STAR_TEMP/smoke"
          mkdir -p "$smoke/project"
          echo 'console.log("hello")' > "$smoke/project/hello.js"
          "$app/Contents/MacOS/$name" --user-data-dir="$smoke/data" --extensions-dir="$smoke/ext" \
            --remote-debugging-port=9333 --disable-workspace-trust "$smoke/project" > "$smoke/app.log" 2>&1 &
          pid=$!
          titles=""
          for i in $(seq 1 60); do
            sleep 2
            titles=$(curl -s http://127.0.0.1:9333/json/list | python3 -c 'import json,sys; print(" | ".join(t.get("title","") for t in json.load(sys.stdin) if t.get("type")=="page"))' 2>/dev/null || true)
            if echo "$titles" | grep -qi 'code'; then break; fi
          done
          sleep 20
          screencapture -x "$smoke/screen.png" || true
          echo "window titles: $titles"
          kill "$pid" 2>/dev/null || true
          sleep 3
          kill -9 "$pid" 2>/dev/null || true
          tail -n 40 "$smoke/app.log" || true
          echo "$titles" | grep -qi 'code'

      - name: Check the binaries are ARM64 (Windows)
        if: matrix.platform == 'win32'
        run: |
          node -e '
            const fs = require("fs"), path = require("path")
            const root = path.resolve(process.argv[1])
            const machine = file => { const b = fs.readFileSync(file); const pe = b.readUInt32LE(0x3c); return b.readUInt16LE(pe + 4) }
            const name = { 0xaa64: "arm64", 0x8664: "x64", 0x14c: "x86" }
            const walk = dir => fs.readdirSync(dir, { withFileTypes: true }).flatMap(e => e.isDirectory() ? walk(path.join(dir, e.name)) : [path.join(dir, e.name)])
            const files = walk(root).filter(f => /\.node$/i.test(f) || path.basename(f) === "STAR Code.exe")
            const wrong = files.filter(f => machine(f) !== 0xaa64)
            for (const f of files) console.log(name[machine(f)] || machine(f).toString(16), path.relative(root, f))
            if (!files.length || wrong.length) { console.error(`${wrong.length} of ${files.length} binaries are not ARM64`); process.exit(1) }
          ' "$GITHUB_WORKSPACE/$STAR_PACKAGE_FOLDER"

      - name: Installer and zip (Windows)
        if: matrix.platform == 'win32'
        working-directory: code
        run: |
          set -euo pipefail
          node ./node_modules/gulp/bin/gulp.js "vscode-win32-${{ matrix.arch }}-inno-updater"
          node ./node_modules/gulp/bin/gulp.js "vscode-win32-${{ matrix.arch }}-user-setup"
          cp .build/win32-${{ matrix.arch }}/user-setup/*.exe "$STAR_TEMP/out/"
          # The zip holds the build at its root ("STAR Code.exe" and its siblings),
          # the layout Build Desktop (Dev) unpacks into the installer.
          cd "$GITHUB_WORKSPACE/$STAR_PACKAGE_FOLDER"
          /c/Windows/System32/tar.exe -a -cf "$STAR_TEMP/out/STAR-Code-win32-${{ matrix.arch }}.zip" *
          ls -l "$STAR_TEMP/out"

      - name: Attach the packages to the release
        run: gh release upload "$RELEASE_TAG" "$STAR_TEMP"/out/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep the launch evidence (macOS)
        if: always() && matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: star-code-launch-${{ matrix.suffix }}
          path: |
            ${{ runner.temp }}/smoke/screen.png
            ${{ runner.temp }}/smoke/app.log
          retention-days: 7
          if-no-files-found: ignore
